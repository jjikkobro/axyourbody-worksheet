function included(r){return saved.inclusion[r.date]!==false}

'save-body':()=>{const val=document.getElementById('body-include').checked;if(!commit({...saved,inclusion:{...saved.inclusion,[selectedDate]:val}})){document.getElementById('body-error').hidden=false;return}dirty=false;route='body';mode='normal';notice=displayDate(selectedDate)+' 기록을 추세에서 '+(val?'포함':'제외')+'하도록 저장했어요. 원본 값은 보존했어요.';render();focusPage();window.scrollTo(0,0)},
'load-samples':loadSamples,
'link-consult':()=>{const value=document.getElementById('link-plan').value;const error=document.getElementById('link-error');if(!value){error.textContent='연결할 계획을 먼저 선택해 주세요.';error.hidden=false;return}const c=saved.consults.find(x=>x.id===selectedConsult);if(c.planId&&c.planId!==value){error.textContent='이미 다른 계획에 연결되어 있어 자동으로 바꾸지 않아요.';error.hidden=false;return}const next={...saved,consults:saved.consults.map(x=>x.id===selectedConsult?{...x,planId:value}:x)};if(!commit(next)){error.textContent='연결 저장 오류 시연입니다. 선택은 유지했어요. 기본 상태로 돌아가 다시 저장해 주세요.';error.hidden=false;return}render();const linked=document.getElementById('link-status');linked?.setAttribute('tabindex','-1');linked?.focus();toast('10.29 오늘 하체 훈련 계획에 연결했어요.')},
'new-consult':()=>showDialog('상담 내용 남기기','<form id="consult-form"><p class="small muted">사용자가 가진 원문을 남겨 주세요. 실제 AI 상담을 생성하지 않아요.</p><div class="field"><label for="new-title">주제</label><input id="new-title" name="title" required maxlength="100"></div><div class="field"><label for="new-date">상담 날짜</label><input id="new-date" name="date" type="date" value="'+PLAN_DATE+'" required></div><div class="field"><label for="new-author">상담 상대</label><select id="new-author" name="author"><option>AI</option><option>코치</option></select></div><div class="field"><label for="new-question">질문</label><textarea id="new-question" name="question" required></textarea></div><div class="field"><label for="new-answer">답변 원문</label><textarea id="new-answer" name="answer" required></textarea></div><div class="field"><label for="new-conclusion">남겨 둔 결론 · 선택</label><textarea id="new-conclusion" name="conclusion"></textarea></div><div class="actions"><button type="button" class="btn" data-action="close-dialog">취소</button><button class="btn primary" type="submit">상담 내용 저장하기</button></div></form>'),
'sleep-input':()=>showDialog('수면 기록 입력 안내','<div style="padding:24px"><p>이 화면은 2026.10.10 기록 누락을 보여주는 독립 사례입니다. 수면 기록을 새로 저장하는 기능은 이번 필수 구현 범위에 포함되지 않았어요.</p><p class="hint">입력하지 않아도 오늘 계획은 직접 결정할 수 있어요. 누락값을 0시간으로 채우지 않습니다.</p><div class="actions" style="margin-top:18px">'+btn('오늘 계획 계속 보기','close-dialog','primary')+'</div></div>'),
'close-dialog':()=>{const d=document.getElementById('dialog');const f=d.querySelector('#consult-form');if(f&&JSON.stringify(Object.fromEntries(new FormData(f)))!==dialogInitial&&!confirm('작성한 상담 내용을 버리고 닫을까요?'))return;d.close()},
'info':()=>showDialog('데이터·저장 안내','<div style="padding:24px"><p>m-athlete의 가상 CSV 기록과 표시된 시연용 계획·상담을 사용합니다. 실제 AI API에는 연결되지 않아요.</p><p style="margin-top:12px">변경 내용은 이 브라우저의 로컬 저장소에만 보관합니다. 서버 전송이나 계정 간 동기화는 없습니다. 브라우저 설정에 따라 파일에서 저장이 제한될 수 있습니다.</p><p class="hint">저장 키: '+STORE+' · 파일을 옮기거나 브라우저 데이터를 지우면 저장 내용이 유지되지 않을 수 있어요.</p><div class="actions" style="margin-top:18px">'+btn('확인','close-dialog','primary')+'</div></div>')};
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.go){if(el.dataset.go.startsWith('unbuilt')){toast('이 메뉴는 준비 중입니다. 운동 계획·체성분 기록·지난 상담을 이용해 주세요.');return}navigate(el.dataset.go)}else if(el.dataset.action)actions[el.dataset.action]?.();else if(el.dataset.condition){condition=Number(el.dataset.condition);markDirty();document.querySelectorAll('[data-condition]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.condition)===condition)))}else if(el.dataset.mode){mode=el.dataset.mode;notice='';if(route==='body-detail'){const value=document.getElementById('body-include').checked;render();document.getElementById('body-include').checked=value}else if(route==='consult-detail'){const value=document.getElementById('link-plan').value;render();document.getElementById('link-plan').value=value}else{if(editing&&!readExercises())return;render()}}else if(el.dataset.body){selectedDate=el.dataset.body;navigate('body-detail')}else if(el.dataset.consult){selectedConsult=el.dataset.consult;navigate('consult-detail')}});
function applyFilter(el){const [scope,key]=el.dataset.filter.split('-');if(scope==='plan'){planFilters[key==='query'?'query':key]=el.value}else if(scope==='body'){bodyFilters[key]=el.value}else if(scope==='consult'){consultFilters[key]=el.value}const id=el.id,pos=el.selectionStart;render();const next=document.getElementById(id);next?.focus();if(pos!==null&&next?.type==='text')next.setSelectionRange(pos,pos)}
document.addEventListener('change',e=>{if(e.target.id==='body-include')markDirty();if(e.target.dataset.filter)applyFilter(e.target)});
let composingFilter=false;document.addEventListener('compositionstart',e=>{if(e.target.dataset.filter)composingFilter=true});document.addEventListener('compositionend',e=>{if(e.target.dataset.filter){composingFilter=false;applyFilter(e.target)}});
document.addEventListener('input',e=>{if(e.target.dataset.exercise){draftSource='내가 수정한 시연용 계획';markDirty();e.target.setCustomValidity('')}if(e.target.id==='condition-note'){conditionNote=e.target.value;markDirty()}if(e.target.dataset.filter&&e.target.tagName==='INPUT'&&e.target.type!=='date'&&!composingFilter&&!e.isComposing)applyFilter(e.target)});
document.addEventListener('submit',e=>{if(e.target.id!=='consult-form')return;e.preventDefault();const f=e.target;if(!f.reportValidity())return;const fd=new FormData(f);const c={id:'user-'+Date.now(),date:fd.get('date'),title:fd.get('title').trim(),author:fd.get('author'),question:fd.get('question').trim(),answer:fd.get('answer').trim(),conclusion:fd.get('conclusion').trim(),isDemo:false,planId:null};if(!c.title||!c.question||!c.answer){toast('주제·질문·답변을 공백 없이 입력해 주세요.');return}if(commit({...saved,consults:[c,...saved.consults]})){document.getElementById('dialog').close();selectedConsult=c.id;route='consult-detail';render();focusPage();toast(storageOK?'상담 내용을 이 브라우저에 저장했어요.':'상담 내용을 이번 실행에만 반영했어요.')}});
document.getElementById('dialog').addEventListener('cancel',e=>{e.preventDefault();actions['close-dialog']()});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
render();
</script></body></html>

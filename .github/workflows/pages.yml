name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-pages.txt
      - run: python scripts/build-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                per_page: 100
              });
              const matching = data.artifacts.filter(a => a.name === name && !a.expired);
              if (matching.length === 1) return;
              if (matching.length > 1) throw new Error(`Duplicate artifact: ${name}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Uploaded artifact not visible yet: ${name}`);
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
